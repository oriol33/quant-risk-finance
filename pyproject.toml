[project]
name = "quant-risk-finance"
version = "0.1.0"
description = "Quantitative finance risk metrics and market analysis"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "certifi",
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "yfinance",
    "openpyxl"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
    "ipykernel",
    "jupyterlab"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
